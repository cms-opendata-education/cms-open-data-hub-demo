# Controlled vocabularies.
# Every value used in a resource record must appear here. CI enforces this.
# To add a term: open a PR adding it here, with a one-line label.

status:
  - id: active
    label: Active
    note: Maintained, verified recently.
  - id: community
    label: Community
    note: Works, but no one has formally signed up to maintain it.
  - id: unmaintained
    label: Unmaintained
    note: Still listed and still usable, but expect rough edges.
  - id: archived
    label: Archived
    note: Kept for the record. Hidden from search by default.

audience:
  - id: middle-school
    label: Middle school
  - id: high-school
    label: High school
  - id: undergrad-intro
    label: Undergraduate, introductory
  - id: undergrad-advanced
    label: Undergraduate, advanced
  - id: graduate
    label: Graduate
  - id: researcher
    label: Researcher
  - id: teacher-development
    label: Teacher professional development
  - id: general-public
    label: General public

# Ordered ladder, least effort first. `level` drives the browse slider and the
# rung indicator. Reorder or insert a rung by editing this list; nothing else
# in the site hardcodes it.
setup_burden:
  - id: none
    level: 0
    label: No computer needed
    note: Paper, puzzles, or printed materials. Works when the lab machines do not.
  - id: web-app
    level: 1
    label: Web page only
    note: Opens in any browser. No account, no login, nothing to install.
  - id: spreadsheet
    level: 2
    label: Spreadsheet
    note: Excel, Google Sheets, or LibreOffice.
  - id: cloud-notebook
    level: 3
    label: Cloud notebook
    note: Binder needs nothing. Colab needs a Google account, which some schools block.
  - id: local-python
    level: 4
    label: Local Python
    note: Someone installs Python and a few packages on each machine.
  - id: local-root
    level: 5
    label: Local ROOT
    note: Needs a working ROOT installation.
  - id: cmssw
    level: 6
    label: CMSSW
    note: Container or virtual machine running the CMS software stack.

