# Datasets and data collections referenced by resources.
# Keyed by the id used in a resource's `data.datasets` list.
# This is deliberately thin: it points at the CERN Open Data Portal record,
# it does not restate it.

dimuon-csv-2011:
  title: Dimuon events, 2011, CSV
  run_period: Run 1
  energy: 7 TeV
  format: csv
  size: A few MB
  events: ~100k per file
  blurb: >
    Small, human-readable CSV files of two-muon events. The lowest-friction
    entry point to real LHC data. Openable in a spreadsheet.
  portal: https://opendata.cern.ch/search?q=dimuon&f=experiment%3ACMS

nanoaod-2015:
  title: 2015 collision data, NanoAOD
  run_period: Run 2
  energy: 13 TeV
  format: nanoaod
  size: 1-50 GB per dataset
  blurb: >
    Flat ROOT ntuples readable with uproot or ROOT, no CMSSW required.
    The sweet spot for undergraduate projects.
  portal: https://opendata.cern.ch/docs/cms-getting-started-nanoaod

miniaod-2015:
  title: 2015 collision data, MiniAOD
  run_period: Run 2
  energy: 13 TeV
  format: miniaod
  size: 100 GB and up
  blurb: >
    Full physics-object content. Needs CMSSW in a container.
    Use this when NanoAOD does not carry the variable you need.
  portal: https://opendata.cern.ch/docs/cms-getting-started-miniaod

aod-2011:
  title: 2011 collision data, AOD
  run_period: Run 1
  energy: 7 TeV
  format: aod
  size: 100 GB and up
  blurb: >
    Run 1 legacy format. Needs the Run 1 CMSSW container.
    Choose this only if you specifically need Run 1.
  portal: https://opendata.cern.ch/docs/cms-getting-started-aod

aod-2010:
  title: 2010 collision data, AOD
  run_period: Run 1
  energy: 7 TeV
  format: aod
  size: Tens of GB and up
  blurb: >
    The first CMS open data release. Small by modern standards and the usual
    starting point for anyone who wants to reproduce an early Run 1 measurement.
  portal: https://opendata.cern.ch/docs/cms-getting-started-2010

heavy-ion-2013-2015:
  title: Heavy-ion data, 2013 and 2015
  run_period: Run 1 and Run 2
  energy: 2.76 and 5.02 TeV
  format: aod
  size: Varies widely
  blurb: >
    Lead-lead and proton-lead collisions. A different physics programme with
    its own reconstruction and its own getting-started guide.
  portal: https://opendata.cern.ch/docs/cms-getting-started-hi-2013-2015

event-display-events:
  title: Curated events for the event display
  run_period: Run 1 and Run 2
  energy: 7 and 13 TeV
  format: event-display
  size: Nothing to download
  blurb: >
    Hand-picked collision events served through a browser-based display.
    Students identify particles by eye before they touch any code.
  portal: https://opendata.cern.ch/search?q=&f=experiment%3ACMS&f=keywords%3Aeducation
