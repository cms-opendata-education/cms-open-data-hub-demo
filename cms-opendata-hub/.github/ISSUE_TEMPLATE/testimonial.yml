name: Share how you used a resource
description: Tell the next teacher what actually happened.
title: "[testimonial] "
labels: ["testimonial"]
body:
  - type: markdown
    attributes:
      value: |
        Honest accounts are more useful than enthusiastic ones. What you cut,
        what confused people, and how long it really took are the details
        nobody else can supply.

  - type: input
    id: resource
    attributes:
      label: Which resource?
      description: The title, or paste the page link.
    validations:
      required: true

  - type: textarea
    id: text
    attributes:
      label: How did it go?
      description: A few sentences is plenty.
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Your name
      description: Leave blank to appear as "Workshop participant".

  - type: input
    id: role
    attributes:
      label: Your role and institution
      placeholder: High school physics teacher

  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: I am happy for this to appear on the public site.
          required: true
