name: Add a resource
description: Suggest an activity, tutorial, or pathway for the index.
title: "[resource] "
labels: ["new-resource"]
body:
  - type: markdown
    attributes:
      value: |
        You do not need to know the schema. Answer what you can and leave the
        rest blank; a maintainer will fill in the gaps and ask if anything is
        unclear. It does not need to be your own work.

  - type: input
    id: title
    attributes:
      label: What is it called?
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Where does it live?
      description: The main link. Add others further down.
      placeholder: https://
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What do students actually do?
      description: Two or three sentences, in plain language.
    validations:
      required: true

  - type: checkboxes
    id: audience
    attributes:
      label: Who is it for?
      options:
        - label: Middle school
        - label: High school
        - label: Undergraduate, introductory
        - label: Undergraduate, advanced
        - label: Graduate
        - label: Researcher
        - label: Teacher professional development
        - label: General public

  - type: dropdown
    id: setup
    attributes:
      label: What does a teacher have to set up first?
      options:
        - Nothing to install, runs in a browser or needs no computer
        - A spreadsheet
        - A cloud notebook such as Colab or Binder
        - Python installed locally
        - ROOT installed locally
        - CMSSW in a container or virtual machine
    validations:
      required: true

  - type: input
    id: duration
    attributes:
      label: How long does it take?
      placeholder: "45 to 90 minutes, or three lab periods"

  - type: textarea
    id: prerequisites
    attributes:
      label: What do students need to know already?
      description: Physics and computing both.

  - type: input
    id: languages
    attributes:
      label: What languages is it available in?
      placeholder: English, Finnish

  - type: textarea
    id: links
    attributes:
      label: Any other links
      description: Repository, Colab, slides, instructor version, solutions, portal record.

  - type: dropdown
    id: maintained
    attributes:
      label: Is anyone maintaining it?
      options:
        - Yes, I maintain it
        - Yes, someone else does
        - No, but it still works
        - I do not know
    validations:
      required: true
